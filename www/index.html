<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Admin</title>
<style>
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% 38%,#1a9a58 0,#0b6b3a 45%,#03401f 100%);color:#fff;font:16px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);box-sizing:border-box;text-align:center}
img{width:168px;height:168px;border-radius:38px;box-shadow:0 16px 48px rgba(0,0,0,.35);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
h1{margin:0;font-size:30px;font-weight:300;letter-spacing:.3px;animation:fade .6s .25s both}
p{margin:0;opacity:.85;font-size:15px;animation:fade .6s .45s both}
.bar{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff}
.bar.run i{animation:load 1.8s .2s ease-in-out forwards}
form{display:flex;flex-direction:column;gap:12px;width:min(320px,100%);animation:fade .5s both}
input{min-height:52px;border-radius:14px;border:0;padding:0 16px;font:18px system-ui,sans-serif;text-align:center;color:#064d27}
button{min-height:52px;padding:0 28px;border-radius:26px;border:0;background:#fff;color:#064d27;font:700 17px system-ui,sans-serif}
button.ghost{background:none;color:#fff;border:1px solid rgba(255,255,255,.5);min-height:44px;font-weight:600;font-size:15px}
.change{background:none;border:0;color:#fff;opacity:.6;font:14px system-ui,sans-serif;min-height:44px;padding:0 12px;text-decoration:underline}
[hidden]{display:none!important}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}
@media (prefers-reduced-motion:reduce){img,h1,p,form,.bar i{animation:none}.bar.run i{width:100%}}
</style>
</head>
<body>
<img src="logo.svg" alt="Life Admin">
<h1 id="hi">Welcome to Life Admin</h1>
<p id="sub"></p>

<form id="who" hidden>
  <input id="name" autocomplete="given-name" placeholder="Your first name" aria-label="Your first name" maxlength="30">
  <button type="submit">Let's go</button>
</form>

<div class="bar" id="bar" hidden><i></i></div>
<button id="open" hidden>Open Life Admin</button>
<button class="change" id="change" hidden>Not you? Change name</button>

<script>
(function(){
  // Darren's own Life Admin (his tracker); everyone else gets the shareable one, which sets up their own tracker
  var DARREN="https://claude.ai/artifact/37YJK3ing21Rw7bVb3PY54";
  var SHARED="https://claude.ai/artifact/CzS2amz5zPkn7o5wCZkEPY";
  var $=function(id){return document.getElementById(id)};
  function load(){try{return localStorage.getItem("la_name")||""}catch(e){return ""}}
  function save(n){try{localStorage.setItem("la_name",n)}catch(e){}}
  function forget(){try{localStorage.removeItem("la_name")}catch(e){}}
  function plugins(){var c=window.Capacitor;return c&&c.Plugins?c.Plugins:{}}
  var name=load(), busy=false, timer=null;

  function urlFor(n){return /^darren\b/i.test(n.trim())?DARREN:SHARED}
  function greeting(n){var h=new Date().getHours();
    return (h<5?"Up late, ":h<12?"Good morning, ":h<17?"Good afternoon, ":"Good evening, ")+n}

  function open(){
    if(busy||!name)return; busy=true;
    var B=plugins().Browser, url=urlFor(name);
    var done=function(){setTimeout(function(){busy=false},1500)};
    if(B&&B.open){
      B.open({url:url,toolbarColor:"#0a6136"}).then(done,function(){
        $("sub").textContent="Couldn't open Chrome. Tap below to try again.";$("open").hidden=false;done();});
    } else { location.href=url; }
  }

  function splash(){
    $("who").hidden=true;
    $("hi").textContent=greeting(name);
    $("sub").textContent="Getting your life admin…";
    var bar=$("bar");bar.hidden=false;bar.classList.remove("run");void bar.offsetWidth;bar.classList.add("run");
    $("change").hidden=false;
    clearTimeout(timer);
    var tries=0;
    timer=setTimeout(function go(){ if(plugins().Browser||++tries>10){open()} else timer=setTimeout(go,150) },2000);
  }

  function ask(){
    clearTimeout(timer);
    $("hi").textContent="Welcome to Life Admin";
    $("sub").textContent="What should I call you?";
    $("bar").hidden=true;$("open").hidden=true;$("change").hidden=true;
    $("who").hidden=false;$("name").value="";
    setTimeout(function(){$("name").focus()},300);
  }

  $("who").addEventListener("submit",function(e){
    e.preventDefault();
    var n=$("name").value.trim().replace(/\s+/g," ");
    if(!n){$("name").focus();return}
    n=n.charAt(0).toUpperCase()+n.slice(1);
    name=n;save(n);splash();
  });
  $("open").addEventListener("click",open);
  $("change").addEventListener("click",function(){forget();name="";ask()});

  if(name)splash();else ask();

  var App=plugins().App;
  if(App&&App.addListener){ App.addListener("appStateChange",function(s){ if(s.isActive&&name){ setTimeout(open,600) } }); }
  var B=plugins().Browser;
  if(B&&B.addListener){ B.addListener("browserFinished",function(){ var A=plugins().App; if(A&&A.minimizeApp)A.minimizeApp(); }); }
})();
</script>
</body>
</html>
